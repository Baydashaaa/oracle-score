[package]
name = "oracle-score"
version = "0.4.0"
edition = "2021"
rust-version = "1.81"
resolver = "3"

exclude = ["contract.wasm", "hash.txt"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-std     = "1.5.8"
cosmwasm-schema  = "1.5.8"
cw-storage-plus  = "1.2.0"
cw2              = "1.1.2"
schemars         = "0.8"
serde            = { version = "1.0", default-features = false, features = ["derive"] }
thiserror        = "1.0"

[dev-dependencies]
cw-multi-test = "0.20.1"
anyhow = "1.0"

[profile.release]
opt-level = "z"
codegen-units = 1
panic = "abort"
overflow-checks = true
rpath = false
lto = true
debug = false
debug-assertions = false
incremental = false
